name: produce-video

# ثلاث مراحل: كتابة ← رسم متوازٍ ← تركيب.
# الرسم المتوازي هو ما يجعل حلقة ٢٠ دقيقة ممكنة: كل قسم يُرسم في خادم مستقلّ،
# فيصير زمن الانتظار بطول أطول قسم لا بمجموع الأقسام.
on:
  workflow_dispatch:
  schedule:
    # حلقة أسبوعية: الجودة قبل الكمّية.
    - cron: "17 7 * * 3"

jobs:
  # ------------------------------------------------ ١) السكريبت والتعليق
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      indices: ${{ steps.plan.outputs.indices }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: كتابة السكريبت وتوليد التعليق
        env:
          # تدوير المفاتيح: يُستهلك الأول ثم ينتقل تلقائيًا للذي يليه.
          # الأسماء غير الموجودة تصل فارغة فتُتجاهَل.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python src/main.py --stage script

      - name: تحديد قائمة المشاهد
        id: plan
        run: |
          set -e
          test -s output/work/indices.json
          echo "indices=$(tr -d '\n ' < output/work/indices.json)" >> "$GITHUB_OUTPUT"
          cat output/work/indices.json

      - uses: actions/upload-artifact@v4
        with:
          name: stage1
          path: output
          retention-days: 7

  # ------------------------------------------------ ٢) رسم المشاهد بالتوازي
  render:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        index: ${{ fromJSON(needs.script.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: stage1
          path: output

      - name: رسم المشهد ${{ matrix.index }}
        run: python src/main.py --stage render --index "${{ matrix.index }}"

      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.index }}
          path: output/work/seg_${{ matrix.index }}.mp4
          retention-days: 3

  # ------------------------------------------------ ٣) التركيب والنشر
  assemble:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: stage1
          path: output

      - name: تنزيل كل المشاهد المرسومة
        uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          merge-multiple: true
          path: output/work

      - name: التركيب (والنشر إن وُجدت أسرار يوتيوب)
        env:
          # مفاتيح Gemini تلزم أيضًا هنا: مرحلة اللغات الإضافية تترجم
          # عبر Gemini قبل الرفع (عناوين موطّنة + سكريبت إنجليزي).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH: ${{ secrets.YT_REFRESH_TOKEN != '' && '1' || '0' }}
        run: python src/main.py --stage assemble

      - name: حفظ الحلقة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            output/video.mp4
            output/script.json
            output/meta.json
            output/subs_*.srt
            output/audio_*.mp3
            output/localizations.json
            output/script_*.json
          retention-days: 14
