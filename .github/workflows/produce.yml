name: produce-video

# يعمل على خوادم GitHub السحابية — جهازك مطفأ والعمل يستمر.
# الريبو عام، فدقائق التشغيل مجانية بلا سقف.
on:
  workflow_dispatch:
  schedule:
    # حلقة أسبوعية: الجودة قبل الكمّية.
    - cron: "17 7 * * 3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت متطلّبات النظام (Manim + ffmpeg + خطوط عربية)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg pkg-config python3-dev \
            libcairo2-dev libpango1.0-dev \
            fonts-hosny-amiri fonts-noto-core fonts-kacst
          echo "--- الخطوط العربية ---"
          fc-list | grep -iE "amiri|kacst|naskh" || echo "تحذير: لا خط عربي"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: صناعة الفيديو (ونشره إن وُجدت أسرار يوتيوب)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH: ${{ secrets.YT_REFRESH_TOKEN != '' && '1' || '0' }}
        run: python src/main.py

      - name: حفظ الفيديو والسكريبت كأثر قابل للتنزيل
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            output/video.mp4
            output/script.json
            output/meta.json
          retention-days: 14
